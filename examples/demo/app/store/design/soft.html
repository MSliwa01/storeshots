<!doctype html>
<!-- storeshots {"background": "gradient", "colours": "one", "rhythm": ["hero", "lean", "hang", "offset", "tilt", "hang", "offset", "hang", "offset"]} -->
<!--
  Style "soft" (after Structured, Tiimo, Finch): calm, friendly, light. A pastel field in
  the brand colour with a soft light from above; ink text with the accent words heavier and
  in the brand's deep tone; phones on a tinted shadow. Dark app screens read as objects on
  paper, light ones as cards.
  Type: Manrope, a light line and a heavy accent.
  For: planners, habits, self-care, family, home, utilities with a friendly voice.
  Compositions: kit/styles/compositions.css.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Manrope; src: url(fonts/Manrope.ttf); font-weight: 200 800; }
  :root { --brand: #2f9e6e; --hue: 154; --deep: hsl(154 41% 11%); --deep-2: hsl(172 38% 17%); --mid: hsl(154 43% 30%); --glow-a: hsl(154 92% 58%); --glow-b: hsl(209 88% 62%); --glow-c: hsl(109 85% 58%); --accent-on-dark: hsl(154 88% 74%); --accent-on-light: hsl(154 64% 28%); --paper: hsl(154 22% 94%); --paper-2: hsl(179 28% 89%); --ink: hsl(154 35% 11%); --vivid: hsl(154 70% 46%); --vivid-2: hsl(182 70% 50%); --vivid-3: hsl(126 70% 44%); --slides: 6; }
  :root { --phone-w: calc(var(--u) * 80); --hero-top: 30%; --offset-top: 28%; --lean: 5deg; --hang-top: -15%;
    --caption-top: calc(var(--u) * 11); --caption-bottom: calc(var(--u) * 10); --ink: #1b1d22; }
  body { background: #fff; font-family: Manrope, sans-serif; }

  /* The pastel: the slide's colour mixed into white, lighter at the top. */
  .field.gradient { background:
    radial-gradient(110% 45% at 50% 0%, color-mix(in srgb, var(--bg) 10%, white) 0%, transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--bg) 20%, white) 0%, color-mix(in srgb, var(--bg) 30%, white) 100%); }

  .caption { text-align: center; color: var(--ink); }
  h1 { margin: 0; font-weight: 500; font-size: calc(var(--u) * 10.8); line-height: 1.04; letter-spacing: -.04em; text-wrap: balance; }
  h1 em { font-weight: 800; color: color-mix(in srgb, var(--bg) 62%, black); letter-spacing: -.045em; }
  p { margin: calc(var(--u) * 2.8) auto 0; max-width: 94%; font-weight: 600; font-size: calc(var(--u) * 5); line-height: 1.2; color: rgba(27, 29, 34, .7); text-wrap: balance; }

  .device { filter: drop-shadow(0 calc(var(--u) * 5) calc(var(--u) * 7) color-mix(in srgb, var(--bg) 45%, rgba(0, 0, 0, .35))); }
  .pop { --pop-shadow: 0 0 0 calc(var(--u) * .6) #fff, 0 calc(var(--u) * 3) calc(var(--u) * 8) color-mix(in srgb, var(--bg) 40%, rgba(0, 0, 0, .3)); }
  .device.is-3d .device-shadow { background: color-mix(in srgb, var(--bg) 50%, rgba(0, 0, 0, .5)); }
  .c-closer .closer-icon { box-shadow: 0 0 0 calc(var(--u) * 1.2) #fff, 0 calc(var(--u) * 5) calc(var(--u) * 10) color-mix(in srgb, var(--bg) 40%, rgba(0, 0, 0, .3)); }
  /* Shared compositions, inlined into every style. Units: --u = 1 % of the slide width.
   A device's slide index is --i; styles tune --phone-w, --hero-top, --lean, --hang-top,
   --caption-top, --caption-bottom. Every phone stays inside its own slide. */
.slide { z-index: 3; }
.caption { position: absolute; inset-inline: calc(var(--u) * 8); top: var(--caption-top, calc(var(--u) * 10)); }
.caption.bottom { top: auto; bottom: var(--caption-bottom, calc(var(--u) * 10)); }
.caption.center { text-align: center; }

.device { position: absolute; z-index: 1; width: var(--phone-w, calc(var(--u) * 80)); }
/* One phone size for the whole set (3D poses excepted): only position and pose change. */
.d-hero, .d-hang, .d-offset { left: calc(var(--slide-w) * var(--i) + (var(--slide-w) - var(--phone-w, calc(var(--u) * 80))) / 2); }
.d-hero { top: var(--hero-top, 32%); }
.d-offset { top: var(--offset-top, 33%); }
.d-hang { top: var(--hang-top, -18%); }
/* Lean: the same phone, centred and tilted (--lean); its empty corners mirror each other. */
/* A tilt widens the phone by its height × sin(angle), so the tilted phone is a little smaller
   (90 %) and tilted gently (5°): its corners keep a clear margin from both slide edges instead
   of grazing the neighbour. */
.d-lean { width: calc(var(--phone-w, calc(var(--u) * 80)) * .9); left: calc(var(--slide-w) * var(--i) + (var(--slide-w) - var(--phone-w, calc(var(--u) * 80)) * .9) / 2);
  top: calc(var(--slide-h) + var(--u) * 10 - var(--phone-w, calc(var(--u) * 80)) * .9 * 2.0408); rotate: var(--lean, 5deg); } /* still runs off the bottom */

/* Pop-outs: grow past the bezel (--pop-reach = width as a share of the phone's). */
.d-hero .pop { --pop-reach: 1.08; }
.d-hang .pop { --pop-reach: 1.08; }
.d-offset .pop { --pop-reach: 1.1; }
.d-lean .pop { --pop-reach: 1.04; }

/* Closer with a fan: the icon and the line at the top, the set's screens below as small
   phones in an arc (centre one in front), running off the bottom edge. */
.c-closer.with-fan .closer-icon { top: 10%; left: calc(50% - var(--u) * 13); width: calc(var(--u) * 26); }
.c-closer.with-fan .caption { top: 24%; }
.d-fan { width: calc(var(--u) * 42); left: calc(var(--slide-w) * var(--i) + var(--u) * (29 + var(--k) * 25));
  top: calc(58% + var(--u) * 7 * var(--k) * var(--k)); rotate: calc(var(--k) * 5deg); z-index: calc(10 - var(--k) * var(--k));
  filter: drop-shadow(0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0, 0, 0, .28)); }

/* Closer: no phone, the app icon and one statement. */
.c-closer .closer-icon { position: absolute; left: calc(50% - var(--u) * 21); top: 31%; width: calc(var(--u) * 42); aspect-ratio: 1; border-radius: 22.5%;
  box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0, 0, 0, .35); }
.c-closer .caption { top: 58%; }

/* 3D: a camera on the phone, real thickness (--depth), pops lifted along z.
   tilt: turned towards the caption; lay: lying on the slide, seen from above. */
.d-tilt { --depth: .1; left: calc(var(--slide-w) * var(--i) + (var(--slide-w) - var(--phone-w, calc(var(--u) * 80)) * .92) / 2); top: var(--tilt-top, 29%);
  width: calc(var(--phone-w, calc(var(--u) * 80)) * .92); transform: perspective(calc(var(--u) * 520)) rotateY(var(--tilt-y, -26deg)) rotateX(var(--tilt-x, 10deg)) rotateZ(var(--tilt-z, -3deg)); }
.d-tilt .pop { --pop-reach: 1; --pop-z: calc(var(--u) * 6); }
.d-lay { --depth: .1; --shadow-y: 0; left: calc(var(--slide-w) * var(--i) + var(--u) * 17); top: var(--lay-top, 25%); width: calc(var(--phone-w, calc(var(--u) * 80)) * .82);
  transform: perspective(calc(var(--u) * 520)) rotateX(var(--lay-x, 34deg)) rotateZ(var(--lay-z, -4deg)); transform-origin: 50% 0; }
.d-lay .pop { --pop-reach: 1.02; --pop-z: calc(var(--u) * 16); }

/* A slide with a laurel under its caption: its phone starts lower. */
.device.with-proof:not(.d-hang) { margin-top: calc(var(--u) * 13); }

</style>
</head>
<body>
<div class="strip">
  <div class="field gradient" style="left: calc(var(--slide-w) * 0); --bg: #28865e"></div>
  <div class="field gradient" style="left: calc(var(--slide-w) * 1); --bg: #28865e"></div>
  <div class="field gradient" style="left: calc(var(--slide-w) * 2); --bg: #28865e"></div>
  <div class="field gradient" style="left: calc(var(--slide-w) * 3); --bg: #28865e"></div>
  <div class="field gradient" style="left: calc(var(--slide-w) * 4); --bg: #28865e"></div>
  <div class="field gradient" style="left: calc(var(--slide-w) * 5); --bg: #28865e"></div>
  <div class="device d-hero" style="--i: 0" data-shot="today">
    <div class="pop" data-crop="60 417 1200 258" data-radius="63" data-leave="#f3f6f2" data-cut="surface" data-fill="#ffffff"></div>
  </div>
  <div class="device d-lean after-hero" style="--i: 1" data-shot="plant">
  </div>
  <div class="device d-offset after-lean" style="--i: 2" data-shot="insights">
    <div class="pop" data-crop="108 481 566 278" data-radius="63" data-leave="#ffffff" data-cut="frame" data-pad="48"></div>
  </div>
  <div class="device d-offset after-offset" style="--i: 3" data-shot="calendar">
    <div class="pop" data-crop="108 765 1104 126" data-radius="63" data-leave="#ffffff" data-cut="frame" data-pad="48"></div>
  </div>
  <div class="device d-tilt after-offset" style="--i: 4" data-shot="reminders">
    <div class="pop" data-crop="60 1035 1200 435" data-radius="63" data-leave="#f3f6f2" data-cut="surface" data-fill="#ffffff"></div>
  </div>
  <div class="device d-fan" style="--i: 5; --k: -1; --n: 3" data-shot="plant"></div>
  <div class="device d-fan" style="--i: 5; --k: 0; --n: 3" data-shot="today"></div>
  <div class="device d-fan" style="--i: 5; --k: 1; --n: 3" data-shot="insights"></div>
  <section class="slide c-hero" id="today" style="--bg: #28865e; --fg: #ffffff; --pill-bg: #ffffff; --pill-fg: #28865e; --sub: rgba(255,255,255,.92)">
    <div class="caption">
      <h1 data-text="today.title" data-fit data-role="title" data-lines="2"></h1>
      <p data-text="today.subtitle" data-role="sub"></p>
    </div>
  </section>
  <section class="slide c-lean" id="plant" style="--bg: #28865e; --fg: #ffffff; --pill-bg: #ffffff; --pill-fg: #28865e; --sub: rgba(255,255,255,.92)">
    <div class="caption">
      <h1 data-text="plant.title" data-fit data-role="title" data-lines="2"></h1>
      <p data-text="plant.subtitle" data-role="sub"></p>
    </div>
  </section>
  <section class="slide c-offset" id="insights" style="--bg: #28865e; --fg: #ffffff; --pill-bg: #ffffff; --pill-fg: #28865e; --sub: rgba(255,255,255,.92)">
    <div class="caption">
      <h1 data-text="insights.title" data-fit data-role="title" data-lines="2"></h1>
      <p data-text="insights.subtitle" data-role="sub"></p>
    </div>
  </section>
  <section class="slide c-offset" id="calendar" style="--bg: #28865e; --fg: #ffffff; --pill-bg: #ffffff; --pill-fg: #28865e; --sub: rgba(255,255,255,.92)">
    <div class="caption">
      <h1 data-text="calendar.title" data-fit data-role="title" data-lines="2"></h1>
      <p data-text="calendar.subtitle" data-role="sub"></p>
    </div>
  </section>
  <section class="slide c-tilt" id="reminders" style="--bg: #28865e; --fg: #ffffff; --pill-bg: #ffffff; --pill-fg: #28865e; --sub: rgba(255,255,255,.92)">
    <div class="caption">
      <h1 data-text="reminders.title" data-fit data-role="title" data-lines="2"></h1>
      <p data-text="reminders.subtitle" data-role="sub"></p>
    </div>
  </section>
  <section class="slide c-closer with-fan" id="closer" style="--bg: #28865e; --fg: #ffffff; --pill-bg: #ffffff; --pill-fg: #28865e; --sub: rgba(255,255,255,.92)">
    <img class="closer-icon" data-app-icon alt="">
    <div class="caption center">
      <h1 data-text="closer.title" data-fit data-role="title" data-lines="2"></h1>
      <p data-text="closer.subtitle" data-role="sub"></p>
    </div>
  </section>
</div>
</body>
</html>
